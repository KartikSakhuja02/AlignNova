services:
  - type: web
    name: alignnova
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm ci --no-audit --no-fund && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-10000} --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
